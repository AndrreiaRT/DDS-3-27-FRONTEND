<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <!-- TABELAS-->
     <header>
        <h1> Tabelas Top</h1>

     <main>
        <h2>PRODUTOS</h2>

         <!-- BORDER = PROPRIEDADES DE BORDA DA TABELA-->

        <table border ="5">
<!-- CABEÇALHO DAD TABELA-->
 <thead>
    <!--  TR  CRAIÇÃO DE UMA LINHA DE TABELA-->
    
      <tr>
        <!-- TH - COLUNA DE CABEÇALHO-->
         <th>ID</th>
          <th>NOME</th>
          <th>QUANTIDADE</th>
          <th>PREÇO</th>
          <th>CATEGORIA</th>
      </tr>
 </thead>
 <!-- TBODY = CORPO DA TABELA-->
<tbody>
    <tr>
        <!-- TD = CÉLULA DA LINHA DO CORPOO-->


    <td>1</td>
    <td>Shampoo CR7</td>
    <td>7</td>
    <td>R$77</td>
    <td> higiene Pessoal</td>
</tr>

<tr>
    <td>2</td>
    <td>Creme Dental</td>
    <td>3</td>
    <td>R$66</td>
    <td>higiene Pessoal</td>
</tr>
<tr>
    <td>2</td>
    <td>Monitor odyssey 27p</td>
    <td>3</td>
    <td>R$ 135,00</td>
    <td>Essencial</td>
</tr>
<tr>

    <!-- rowspan = diz a quantiadade de linhas e célular vaiocupar na tabela-->

</tr>

<!-- TFOOT - RODAPÁ DA TABELA-->
 <footer>
    <tr>
        <td colspan="5">Tabela feita por: Andreia</td>
    </tr>
 </footer>

        </table>
     </main>

</body>
</html>
