<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <!-- fieldset - segmenta visualmente o formulário-->
        <fieldset>

            <!-- legend = título do segmento-->
            <legend>Dados pessoais</legend>
            <!-- caixinha de nome-->
            <label for="">Nome</label>
            <input type="text" name= "nome" id="nome">
            <!--Fim da caixinha nome-->


            <br> <br>

            <!-- caixinha de data de nascimento-->
             <label for="">Data de nascimento</label>
             <!-- date - apenas data-->
             <input type="date" name="" id="">
            <!-- datetime- local - data e hora juntos-->
             <input type="datetime-local">
             <!-- time = apenas hora-->
             <input type="time">
             <!-- Fim de caixinha data de nascimento-->


              <br> <br>

              <!-- caixinha de números-->
               <label for="Filhos">Quantidade de Filhos</label>
               <input type="number" name="Filhos" id="Filhos" min="-3" max="301" step="0.7" value="5">
               <!-- Fim de caixinha de números-->


        </fieldset>
    </form>
</body>
</html>
