<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <header>
        <h1>TRABALHANDO COM IMPUT</h1>
    </header>
    <!-- INPUT-->
    <main>
        <H2>Formulário de cadastro</H2>
        <!-- input - Coleta informações do usuários-->

            <!-- form - englobar os campos do formulário-->
            <!-- action = para onde vão as informações-->
            <!-- method = forma de como vão as informações-->

        <form action="" method="">

             <!-- label = texto de apoio pra guiar o input-->
             <!-- label sem input -->
            <label for="nomecompleto">Nome Completo:</label>
           
            <!--text - caracteres em geral --> 
            <!-- name - usado para identificar o input quando enviar os dadosl-->
            <!--id - identificação daquele elemento html-->
           
            <input type="text" name ="nomecompleto" id="nomecompleto">

            <br>
            <br>
            <!--  forma 2- input dentro do Label-->
            <label> 
                senha:
                <!-- password - senhas-->
                <input type="password">
            </label>
        </form>

    </main>
<footer>
    <p>DIREITOS SÃO MEUS, EU QUE FIZ TUDO</p>
</footer>
</body>
</html>
